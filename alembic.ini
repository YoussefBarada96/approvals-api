# Alembic configuration. The database URL is not set here: migrations/env.py
# reads it from the app settings (the DATABASE_URL environment variable).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revision files are named "<rev>_<slug>.py". Create new ones with a
# sequential id, e.g.: alembic revision --autogenerate --rev-id 0002 -m "add x"
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
