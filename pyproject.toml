[project]
name = "approvals-api"
version = "0.1.0"
description = "A workflow and approval engine: multi-step approvals, audit trail, and SLA escalation."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
