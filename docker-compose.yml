services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: approvals
      POSTGRES_PASSWORD: approvals
      POSTGRES_DB: approvals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvals -d approvals"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://approvals:approvals@db:5432/approvals
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
