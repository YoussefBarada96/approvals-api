services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: approvals
      POSTGRES_PASSWORD: approvals
      POSTGRES_DB: approvals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvals -d approvals"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies migrations once and exits. Running them here rather than on API
  # startup means several API replicas never race to migrate the same database.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://approvals:approvals@db:5432/approvals
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://approvals:approvals@db:5432/approvals
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Escalates overdue steps. Safe to scale: docker compose up --scale worker=3
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://approvals:approvals@db:5432/approvals
      WORKER_POLL_SECONDS: "10"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
